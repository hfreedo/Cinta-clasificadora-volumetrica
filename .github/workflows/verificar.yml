name: Compilar firmwares y probar app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch:
          - volumetrico/Volumetrico_UNO
          - volumetrico/Test_Ultrasonicos_Vivo
          - cinta-clasificadora/conveyor
          - cinta-clasificadora/conveyor_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: arduino/setup-arduino-cli@v2.0.0
      - name: Instalar core y bibliotecas
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "Servo@1.3.0" "LiquidCrystal I2C@1.1.2"
      - name: Compilar para UNO
        run: arduino-cli compile --fqbn arduino:avr:uno "${{ matrix.sketch }}"
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r volumetrico/VolumetroDesk/requirements.txt
      - name: Pruebas con transporte simulado
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s volumetrico/VolumetroDesk -p 'test_*.py' -v
